<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <radialGradient id="coinFace" cx="42%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#FFF8D4"/>
      <stop offset="26%" stop-color="#F6C84C"/>
      <stop offset="58%" stop-color="#D59A21"/>
      <stop offset="100%" stop-color="#7A5210"/>
    </radialGradient>
    <radialGradient id="coinRim" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#D59A21"/>
      <stop offset="90%" stop-color="#A67414"/>
      <stop offset="100%" stop-color="#4A3208"/>
    </radialGradient>
    <linearGradient id="studHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="40%" stop-color="#F6C84C"/>
      <stop offset="100%" stop-color="#9A6A18"/>
    </linearGradient>
    <linearGradient id="markFace" x1="22%" y1="16%" x2="76%" y2="88%">
      <stop offset="0%" stop-color="#FFF0A6"/>
      <stop offset="32%" stop-color="#F6C84C"/>
      <stop offset="100%" stop-color="#8A6520"/>
    </linearGradient>
    <linearGradient id="markShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2906"/>
      <stop offset="100%" stop-color="#1A1203"/>
    </linearGradient>
    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="36" result="blur"/>
      <feFlood flood-color="#9B3DFF" flood-opacity="0.38" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coinDrop" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#070B12" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#purpleGlow)">
    <g filter="url(#coinDrop)">
      <circle cx="512" cy="512" r="400" fill="url(#coinRim)"/>
      <circle cx="512" cy="512" r="372" fill="url(#coinFace)"/>
      <circle cx="512" cy="512" r="356" fill="none" stroke="#B88318" stroke-opacity="0.5" stroke-width="4"/>
      <circle cx="512" cy="512" r="322" fill="none" stroke="#5C3F0C" stroke-opacity="0.28" stroke-width="3"/>
    </g>
  </g>

  <!-- Vault-wheel studs on rim -->
  <g fill="url(#studHi)" stroke="#6B4810" stroke-width="2" transform="translate(512 512)">
    <g transform="rotate(0)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(22.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(45)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(67.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(90)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(112.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(135)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(157.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(180)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(202.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(225)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(247.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(270)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(292.5)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(315)"><circle cx="0" cy="-382" r="21"/></g>
    <g transform="rotate(337.5)"><circle cx="0" cy="-382" r="21"/></g>
  </g>

  <!-- V + C with twin slashes (virtual currency mark) -->
  <g transform="translate(512 512)">
    <g fill="url(#markShadow)" opacity="0.9" transform="translate(6 10)">
      <path d="M-182 150 L-62 -168 L-12 -168 L108 150 L48 150 L-37 -28 L-122 150 Z"/>
      <path
        d="M 52 -168
           C 168 -168 242 -92 242 8
           C 242 108 168 178 52 178
           L 32 128
           C 132 128 188 78 188 8
           C 188 -62 132 -118 32 -118
           L 52 -168 Z"/>
    </g>
    <g fill="url(#markFace)">
      <path d="M-182 150 L-62 -168 L-12 -168 L108 150 L48 150 L-37 -28 L-122 150 Z"/>
      <path
        d="M 52 -168
           C 168 -168 242 -92 242 8
           C 242 108 168 178 52 178
           L 32 128
           C 132 128 188 78 188 8
           C 188 -62 132 -118 32 -118
           L 52 -168 Z"/>
    </g>
    <g stroke="#52380A" stroke-width="17" stroke-linecap="round">
      <path d="M88 -138 L188 48"/>
      <path d="M118 -168 L218 18"/>
    </g>
    <g stroke="#FFF0A6" stroke-width="5" stroke-linecap="round" opacity="0.45">
      <path d="M86 -142 L184 44"/>
      <path d="M116 -172 L214 14"/>
    </g>
  </g>
</svg>
